spring:
  application:
    name: finance-ai-analyzer
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${PORT:9090}             # Azure App Service / Container Apps inject the port via env
  shutdown: graceful
  forward-headers-strategy: framework   # honour X-Forwarded-* from the Azure front end

management:
  endpoints:
    web:
      exposure:
        include: health          # only the health endpoint is exposed (/actuator/health for Azure probes)
  endpoint:
    health:
      probes:
        enabled: true            # /actuator/health/liveness and /readiness

# ---------------------------------------------------------------------------
# LLM provider (default: openai; set LLM_PROVIDER=local for Ollama).
#   openai -> OpenAI API (needs OPENAI_API_KEY)
#   local  -> Ollama on this machine (no API key needed)
# ---------------------------------------------------------------------------
llm:
  provider: ${LLM_PROVIDER:local}
  timeout-seconds: 600           # cap for one whole LLM call; a CPU-only local model can need minutes for a big chunk
  local:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    api-key: ${OLLAMA_API_KEY:}          # optional; sent as a bearer token only when set
    model: ${LOCAL_LLM_MODEL:llama3.2:1b}  # e.g. codellama:7b, or qwen2.5:3b (the previous default)
    temperature: 0.1
    context-length: 8192                 # Ollama num_ctx: prompt + reply must fit (Ollama's default is much smaller)
    max-output-tokens: 4096              # Ollama num_predict: hard cap so a small model cannot ramble forever
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}          # required when provider is openai
    model: ${OPENAI_MODEL:gpt-4o-mini}
    temperature: 0.1                     # dropped automatically for models that only accept the default

# ---------------------------------------------------------------------------
# Chunked processing
# ---------------------------------------------------------------------------
analyzer:
  chunking:
    transactions-per-chunk: 10   # N transaction records per LLM request (smaller = faster calls, finer progress)
    max-chars-per-chunk: 8000    # hard cap on prompt size per chunk
  processing:
    concurrency: 1               # chunks in flight at once (1 = sequential; keep 1 for a local model)
    max-attempts: 2              # LLM attempts per call before a chunk is marked failed
    min-interval-ms: 0           # rate limit: minimum gap between LLM call starts (0 = off)
    max-concurrent-jobs: 2       # analyses running at the same time

  logging:
    log-payloads: ${LOG_PAYLOADS:false}   # INFO-log prompt input + raw/parsed model output. Contains statement data (PII): keep false outside local debugging

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [job=%X{jobId:-}] [%X{chunkId:-}] %logger{24} - %msg%n"
  level:
    com.finance: INFO            # INFO = flow milestones, DEBUG = prompts and raw LLM output (contains statement data)
