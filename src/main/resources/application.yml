spring:
  application:
    name: finance-ai-analyzer
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${PORT:9090}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health          # /actuator/health

# ---------------------------------------------------------------------------
# OpenAI
# ---------------------------------------------------------------------------
llm:
  timeout-seconds: 120           # cap for one OpenAI call
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}  # required: the app refuses to start without it
    model: ${OPENAI_MODEL:gpt-4o-mini}
    temperature: 0.1             # dropped automatically for models that only accept the default

# ---------------------------------------------------------------------------
# Chunked processing
# ---------------------------------------------------------------------------
analyzer:
  chunking:
    transactions-per-chunk: 25   # N transaction records per OpenAI request
    max-chars-per-chunk: 8000    # hard cap on prompt size per chunk
  processing:
    concurrency: 2               # chunks in flight at once (raise carefully: OpenAI rate limits apply)
    max-attempts: 3              # attempts per call before a chunk is marked failed
    min-interval-ms: 0           # minimum gap between OpenAI call starts (0 = off)
    max-concurrent-jobs: 2       # analyses running at the same time
  logging:
    log-payloads: ${LOG_PAYLOADS:false}   # INFO-log prompts and raw replies. Contains statement data (PII): keep false

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [job=%X{jobId:-}] [%X{chunkId:-}] %logger{24} - %msg%n"
  level:
    com.finance: INFO
